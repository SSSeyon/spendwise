let db, running=false;

function log(msg,cls='info'){
  const el=document.getElementById('log');
  el.innerHTML+=`<span class="${cls}">${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}

async function runImport(){
  if(running) return;
  running=true;
  const btn=document.getElementById('btn');
  const prog=document.getElementById('prog');
  btn.disabled=true;
  prog.style.display='block';
  prog.value=0;
  document.getElementById('log').textContent='';

  if(!db){
    log('Connecting to Firebase…');
    try{firebase.initializeApp(firebaseConfig);}catch(e){}
    db=firebase.firestore();
    log('Connected.\n');
  }

  let ok=0, fail=0, curKey='';
  for(let idx=0; idx<ALL_DOCS.length; idx++){
    const {_docId,_col,...fields}=ALL_DOCS[idx];
    const mk=`${fields.year}-${String(fields.month).padStart(2,'0')} (${_col==='transactions'?'exp':'inc'})`;
    if(mk!==curKey){
      if(curKey) log('');
      log(`── ${mk}`, 'hdr');
      curKey=mk;
    }
    try{
      await db.collection(_col).doc(_docId).set(fields,{merge:true});
      log(`  ✓  ${fields.category.padEnd(24)} ${fields.amount.toLocaleString('en-NG').padStart(13)}`, 'ok');
      ok++;
    }catch(e){
      log(`  ✗  ${fields.category}: ${e.message}`, 'err');
      fail++;
    }
    prog.value=idx+1;
    if(idx%15===14) await new Promise(r=>setTimeout(r,60));
  }

  log(`\n${ok} written · ${fail} failed`, fail===0?'ok':'err');
  if(fail===0) log('\n✅ Done — reload SpendWise, go to Forecast → History, tap any month.','ok');
  btn.textContent='Run Again';
  btn.disabled=false;
  running=false;
}
