let db, running=false;

function log(msg,cls='info'){
  const el=document.getElementById('log');
  el.innerHTML+=`<span class="${cls}">${msg}</span>\n`;
  el.scrollTop=el.scrollHeight;
}

async function runImport(){
  if(running) return;
  running=true;
  const btn=document.getElementById('btn');
  const prog=document.getElementById('prog');
  btn.disabled=true;
  prog.style.display='block';
  prog.value=0;
  document.getElementById('log').textContent='';

  if(!db){
    log('Connecting to Firebase…');
    try{firebase.initializeApp(firebaseConfig);}catch(e){}
    db=firebase.firestore();
    log('Connected.\n');
  }

  let ok=0, fail=0, curCol='';
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const INV_KEYS=['Piggy','PiggySafelock','RenVault','Risevest','Trove','Bamboo','USDHoldings'];
  const CASH_KEYS=['GTB','Access','Renmoney','Union'];
  const USD_KEYS=['Risevest','Trove','Bamboo','USDHoldings'];

  for(let idx=0; idx<ALL_DOCS.length; idx++){
    const {_docId,_col,...fields}=ALL_DOCS[idx];
    const colLabel=_col==='investments'?'investments':'cashBalances';
    if(colLabel!==curCol){
      if(curCol) log('');
      log(`── ${colLabel} (${_col==='investments'?26:26} docs)`,'hdr');
      curCol=colLabel;
    }
    const m=fields.month, y=fields.year;
    const lbl=`${MONTHS[m-1]} '${String(y).slice(2)}`;
    const dataKeys=Object.keys(fields).filter(k=>k!=='month'&&k!=='year');
    const summary=dataKeys.map(k=>{
      const isUSD=USD_KEYS.includes(k);
      const val=fields[k];
      if(val===null||val===undefined) return null;
      return `${k}=${isUSD?'$':'₦'}${Number(val).toLocaleString('en-NG',{maximumFractionDigits:0})}`;
    }).filter(Boolean).join('  ');
    try{
      await db.collection(_col).doc(_docId).set(fields,{merge:true});
      log(`  ✓  ${lbl.padEnd(10)} ${summary}`,"ok");
      ok++;
    }catch(e){
      log(`  ✗  ${lbl} (${_docId}): ${e.message}`,"err");
      fail++;
    }
    prog.value=idx+1;
    if(idx%10===9) await new Promise(r=>setTimeout(r,50));
  }

  log(`\n${ok} written · ${fail} failed`,fail===0?'ok':'err');
  if(fail===0) log('\n✅ Done — reload SpendWise, navigate to the Accounts tab to see balances.','ok');
  btn.textContent='Run Again';
  btn.disabled=false;
  running=false;
}
